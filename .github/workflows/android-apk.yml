name: Build Android APK (Unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Enable RN new architecture
        run: echo "RCT_NEW_ARCH_ENABLED=1" >> "$GITHUB_ENV"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build APK (unsigned)
        run: |
          cd android
          ./gradlew assembleRelease

      - name: List APK outputs
        run: |
          find android/app/build/outputs -type f -name "*.apk" -print || true

      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-apk
          path: android/app/build/outputs/**/*.apk
