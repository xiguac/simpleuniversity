name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ios-build.yml'

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain versions
        run: |
          node -v
          npm -v
          xcodebuild -version
          pod --version

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Enable RN new architecture
        run: echo "RCT_NEW_ARCH_ENABLED=1" >> "$GITHUB_ENV"

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Detect workspace and scheme
        run: |
          cd ios
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" -print -quit)
          if [ -z "$WORKSPACE" ]; then
            echo "No .xcworkspace found in ios/."
            exit 1
          fi

          SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE" | python3 -c "import json,sys; d=json.load(sys.stdin); s=d.get('workspace',{}).get('schemes',[]); print(next((x for x in s if not x.startswith('Pods-')), s[0] if s else ''))")
          if [ -z "$SCHEME" ]; then
            echo "No scheme found in workspace $WORKSPACE"
            exit 1
          fi

          echo "IOS_WORKSPACE=${WORKSPACE#./}" >> "$GITHUB_ENV"
          echo "IOS_SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "Detected workspace: ${WORKSPACE#./}"
          echo "Detected scheme: $SCHEME"

      - name: Build archive (unsigned)
        run: |
          cd ios
          xcodebuild \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "build/${IOS_SCHEME}.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Create IPA artifact (unsigned)
        run: |
          cd ios/build
          rm -rf Payload app-unsigned.ipa
          mkdir -p Payload
          cp -R "${IOS_SCHEME}.xcarchive/Products/Applications"/*.app Payload/
          /usr/bin/zip -r app-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa-${{ github.run_number }}
          path: ios/build/app-unsigned.ipa
          if-no-files-found: error
