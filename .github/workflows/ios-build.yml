name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      # 1️⃣ 拉代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Node环境（用20更稳）
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ 安装依赖
      - name: Install dependencies
        run: npm install

      # 4️⃣ 生成 iOS 原生项目（关键：用 npx expo，不用 expo-cli）
      - name: Expo prebuild
        run: npx expo prebuild --platform ios

      # 5️⃣ 安装 CocoaPods
      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      # 6️⃣ 构建 .app（不签名）
      - name: Build app (no signing)
        run: |
          cd ios
          xcodebuild \
            -workspace *.xcworkspace \
            -scheme $(ls *.xcodeproj | sed 's/.xcodeproj//') \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO

      # 7️⃣ 生成 IPA（手动打包 Payload）
      - name: Create IPA
        run: |
          cd ios/build
          mkdir -p Payload
          cp -r App.xcarchive/Products/Applications/*.app Payload/
          zip -r app.ipa Payload

      # 8️⃣ 上传 IPA
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/build/app.ipa